<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./feroza.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feroza-AdminPanel</title>
    <style>
      /* Immediate base styling to prevent white flicker before scripts load */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0c2025;
      }
      .initial-loader-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background: radial-gradient(circle at center, #14282e 0%, #0c2025 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .initial-spinner {
        width: 46px;
        height: 46px;
        border: 3.5px solid rgba(86, 219, 252, 0.15);
        border-top-color: #56dbfc;
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }
      .initial-loader-text {
        margin-top: 18px;
        color: #56dbfc;
        font-size: 14px;
        letter-spacing: 0.08em;
        font-weight: 500;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Renders instantly on first HTML parse, disappears when React mounts -->
      <div class="initial-loader-wrapper">
        <div class="initial-spinner"></div>
        <div class="initial-loader-text">Loading Feroza Admin...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
