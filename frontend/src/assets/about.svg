<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ferozaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1215" />
      <stop offset="50%" stop-color="#0f262c" />
      <stop offset="100%" stop-color="#061013" />
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="orbTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#46d1f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#46d1f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aaf5fa" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#aaf5fa" stop-opacity="0" />
    </radialGradient>

    <!-- Glassmorphic Card Fill -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Neon Border Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aaf5fa" />
      <stop offset="50%" stop-color="#46d1f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#aaf5fa" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#46d1f7" flood-opacity="0.3" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,600&amp;family=Plus+Jakarta+Sans:wght@300;400;600;700&amp;display=swap');

      .brand-title { font-family: 'Playfair Display', Georgia, serif; font-weight: 800; fill: #aaf5fa; font-size: 68px; letter-spacing: 5px; }
      .description { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 300; fill: #e2e8f0; font-size: 22px; }
      .badge-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; fill: #071619; font-size: 13px; letter-spacing: 2.5px; }
      .badge-main { font-family: 'Playfair Display', Georgia, serif; font-weight: 800; fill: #071619; font-size: 54px; }
      .footer-title { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; fill: #ffffff; font-size: 34px; letter-spacing: 2px; }
      .url-text { font-family: 'Plus Jakarta Sans', monospace; font-weight: 700; fill: #aaf5fa; font-size: 18px; letter-spacing: 3px; }

      /* Pulse animations for background lighting */
      @keyframes floatPulse {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.8; }
        50% { transform: scale(1.15) translate(20px, -20px); opacity: 1; }
        100% { transform: scale(1) translate(0px, 0px); opacity: 0.8; }
      }
      .pulse-bg-1 { animation: floatPulse 8s ease-in-out infinite; transform-origin: center; }
      .pulse-bg-2 { animation: floatPulse 10s ease-in-out infinite reverse; transform-origin: center; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="1000" fill="url(#ferozaBg)" />

  <!-- Animated Ambient Lighting Orbs -->
  <g class="pulse-bg-1">
    <circle cx="850" cy="250" r="380" fill="url(#orbTeal)" />
    <circle cx="150" cy="850" r="320" fill="url(#orbCyan)" />
  </g>
  <g class="pulse-bg-2">
    <circle cx="200" cy="200" r="300" fill="url(#orbTeal)" opacity="0.5" />
    <circle cx="800" cy="750" r="350" fill="url(#orbCyan)" opacity="0.6" />
  </g>

  <!-- Vector Hangers & Clothing Silhouette Grid -->
  <g opacity="0.25">
    <!-- Hangers -->
    <path d="M 210 120 Q 260 80 310 140 L 310 180" stroke="#aaf5fa" stroke-width="3" fill="none" />
    <path d="M 460 110 Q 510 70 560 130 L 560 170" stroke="#aaf5fa" stroke-width="3" fill="none" />
    <path d="M 710 120 Q 760 80 810 140 L 810 180" stroke="#aaf5fa" stroke-width="3" fill="none" />

    <!-- Hanging Clothes Layer -->
    <path d="M 160 180 L 410 210 Q 380 650 350 720 Q 240 730 160 690 Z" fill="#142c33" />
    <path d="M 400 190 L 640 210 Q 610 660 580 720 Q 480 730 400 690 Z" fill="#1d3d47" />
    <path d="M 620 170 L 890 200 Q 860 660 830 720 Q 720 730 630 690 Z" fill="#0f2126" />
  </g>

  <!-- Main Glassmorphism Card Container -->
  <g filter="url(#glowShadow)">
    <rect x="60" y="150" width="880" height="450" rx="24" fill="url(#glassCard)" stroke="url(#neonBorder)" stroke-width="2" />
  </g>

  <!-- Top Text Overlay -->
  <text x="110" y="260" class="brand-title">FEROZA</text>

  <text x="110" y="335" class="description">Slim-fit cotton shirt, breathable, stylish,</text>
  <text x="110" y="375" class="description">comfortable, easy-care,</text>
  <text x="110" y="415" class="description">premium quality.</text>

  <!-- Glowing Special Offer Badge -->
  <g transform="translate(660, 470)" filter="url(#glowShadow)">
    <circle cx="110" cy="110" r="110" fill="#aaf5fa" />
    <text x="110" y="65" text-anchor="middle" class="badge-sub">SPECIAL OFFER</text>
    <text x="110" y="125" text-anchor="middle" class="badge-main">30%</text>
    <text x="110" y="175" text-anchor="middle" class="badge-main">OFF</text>
  </g>

  <!-- Bottom Dark Accent Footer -->
  <rect x="0" y="740" width="1000" height="260" fill="#050c0e" opacity="0.95" />
  <line x1="0" y1="740" x2="1000" y2="740" stroke="#46d1f7" stroke-opacity="0.4" stroke-width="2" />

  <!-- Footer Banner Text -->
  <text x="80" y="835" class="footer-title">SUITABLE FOR</text>
  <text x="80" y="880" class="footer-title">ALL BABIES</text>

  <!-- Website URL Pill Container -->
  <g transform="translate(520, 830)">
    <rect width="400" height="64" rx="14" fill="#0d1f24" stroke="#46d1f7" stroke-width="1.5" />
    <text x="200" y="40" text-anchor="middle" class="url-text">WWW.FEROZA.COM</text>
  </g>
</svg>
