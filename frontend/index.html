<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Updated path to /src/feroza.svg and type to image/svg+xml -->
    <link rel="icon" type="image/svg+xml" href="/src/feroza.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/index.css" rel="stylesheet">
    <title>feroza</title>
    <style>
      /* Immediate base styling to prevent white flicker before scripts load */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #141414;
      }
      .initial-loader-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background: radial-gradient(circle at center, #1b252b 0%, #141414 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .initial-spinner {
        width: 44px;
        height: 44px;
        border: 3.5px solid rgba(86, 219, 252, 0.15);
        border-top-color: #56dbfc;
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }
      .initial-loader-text {
        margin-top: 16px;
        color: #56dbfc;
        font-size: 14px;
        letter-spacing: 0.1em;
        font-weight: 500;
        text-transform: uppercase;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#141414] text-white">
    <div id="root">
      <!-- Displays immediately while React loads, replaced as soon as React mounts -->
      <div class="initial-loader-wrapper">
        <div class="initial-spinner"></div>
        <div class="initial-loader-text">Loading Feroza...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
