<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Dark Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1215" />
      <stop offset="50%" stop-color="#0e2328" />
      <stop offset="100%" stop-color="#050a0c" />
    </linearGradient>

    <!-- Glass Facet Gradients -->
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#a5faf7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="facetMedium" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="facetGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5faf7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.2" />
    </linearGradient>

    <!-- Outer Ambient Glow Radial -->
    <radialGradient id="ambientCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow + Neon Reflection -->
    <filter id="glassGlowShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="0" stdDeviation="25" flood-color="#22d3ee" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)" />

  <!-- Back Ambient Glow -->
  <circle cx="250" cy="230" r="180" fill="url(#ambientCyan)" />

  <!-- Main Glassmorphic Gem Diamond Base -->
  <g filter="url(#glassGlowShadow)">
    
    <!-- Top Crown Left Facet -->
    <polygon points="250,70 140,170 250,230" fill="url(#facetLight)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Top Crown Right Facet -->
    <polygon points="250,70 360,170 250,230" fill="url(#facetMedium)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

    <!-- Left Pavilion Facet -->
    <polygon points="140,170 250,400 250,230" fill="url(#facetMedium)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

    <!-- Right Pavilion Facet -->
    <polygon points="360,170 250,400 250,230" fill="url(#facetLight)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- Embedded Glass "F" Monogram Cutout -->
    <!-- Vertical Spine -->
    <path d="M 210,130 L 235,130 L 235,320 L 210,320 Z" fill="url(#facetGlow)" />
    
    <!-- Top Arm -->
    <path d="M 235,130 L 305,130 L 295,155 L 235,155 Z" fill="url(#facetGlow)" />
    
    <!-- Middle Arm -->
    <path d="M 235,200 L 285,200 L 275,222 L 235,222 Z" fill="url(#facetGlow)" />

    <!-- Diamond Light Sparkles / Reflections -->
    <circle cx="250" cy="70" r="4" fill="#ffffff" filter="drop-shadow(0 0 6px #a5faf7)" />
    <circle cx="140" cy="170" r="3" fill="#ffffff" filter="drop-shadow(0 0 4px #a5faf7)" />
    <circle cx="360" cy="170" r="3" fill="#ffffff" filter="drop-shadow(0 0 4px #a5faf7)" />
    <circle cx="250" cy="400" r="4" fill="#ffffff" filter="drop-shadow(0 0 6px #a5faf7)" />
  </g>
</svg>
